name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AFAT Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      - name: Prepare project API configuration
        run: |
          cat > API_KEYS <<'EOF'
          APP_ID=30357243
          APP_HASH=9782c26101c502f026721b8e7993786c
          EOF

      - name: Verify project
        run: |
          test -f gradlew
          test -d TMessagesProj
          test -d TMessagesProj_App

          echo "Project structure:"
          ls -la

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Show Gradle version
        run: |
          ./gradlew --version

      - name: Build AFAT Release APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        if: always()
        run: |
          echo "===== APK FILES ====="

          find TMessagesProj_App \
            -type f \
            -name "*.apk" \
            -print || true

          echo "====================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-AFAT
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
