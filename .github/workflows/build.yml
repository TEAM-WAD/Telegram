name: Build Telegram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Build Configuration
      run: |
        rm -rf TMessagesProj_AppStandalone/build .gradle build
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "APP_ID=30357243" >> gradle.properties
        echo "APP_HASH=9782c26101c502f026721b8e7993786c" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Telegram APK
      run: ./gradlew assembleAfatDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Custom-APK
        path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
